apiVersion: v1
kind: Service
metadata:
  name: {{ include "pro-jection.fullname" . }}
  labels:
    {{- include "pro-jection.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "pro-jection.selectorLabels" . | nindent 4 }}

{{- if .Values.ingress.enabled }}
# Traefik middleware: permanent redirect HTTP -> HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "pro-jection.fullname" . }}-https-redirect
  labels:
    {{- include "pro-jection.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
